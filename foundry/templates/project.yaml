# Project settings read by the orchestrator and agents.
name: my-project

commands:
  build: ""        # for example: pip install -e .
  test: ""         # for example: pytest
  run: ""          # for example: python -m myapp   (used by the Playwright agent)
  smoke: ""         # used when has_ui is false: exits 0 on pass, for example: python -m myapp --selftest

has_ui: false      # true: Playwright browser flows. false: scripted smoke test.
base_url: ""       # only when has_ui is true, for example http://localhost:3000

models:
  primary: claude
  fallback: gemini-3.8-flash    # model name is config, swap it any time. agy and the REST API both accept it
  fallback_provider: agy        # agy | gemini-api (gemini-api needs GEMINI_API_KEY in the environment)
  fallback_allowed_for:         # bounded work only
    - tests
    - docs
    - small-fixes

limits:
  review_retry_cap: 3           # developer and reviewer loops before escalating to the human
  probe_interval_minutes: 20    # how often to probe Claude when no exact reset time is known
  default_cooldown_minutes: 300 # assumed wait when a rate limit error has no retry time
  agent_timeout_minutes: 30     # timeout for a tool-using developer run (mode: agent)
  command_timeout_seconds: 300  # per verify, test, smoke command; the whole process group is killed on timeout

verify_allowlist: [go, uv, pytest, npm, make]   # first word of a task's `Verify:` line must be one of these

# Optional agent settings. Put agents/<role>.md in your project to override any built-in role prompt.
agents:
  developer:
    mode: diff                  # diff (default: model replies with a unified diff) | agent (Claude Code edits in a git worktree)
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep

# Optional context settings for repo snapshots and document sources.
context:
  max_chars: 60000
  include: []                   # fnmatch globs; empty means all tracked files
  exclude:                      # fnmatch globs skipped from repo snapshots
    - "*.lock"
    - "uv.lock"
    - "go.sum"
    - "LICENSE*"
  docs:                         # override where constitution, spec, and plan are read from
    constitution: constitution.md
    spec: spec.md
    plan: plan.md

# Regexes (case insensitive) matched against error output only. A match means rate limited.
# Anything else that fails is a hard error and does not trigger the fallback.
rate_limit_patterns:
  claude:
    - "hit your limit"
    - "usage limit"
    - "rate limit"
    - "limit reached"
  agy:
    - "RESOURCE_EXHAUSTED"
    - "quota"
    - "rate limit"
    - "\\b429\\b"

# Developer diffs that touch these paths are rejected. fnmatch patterns, case insensitive,
# matched against the normalized full path and the file name. These ADD to the built-in defaults
# (constitution.md, spec.md, plan.md, tasks.md, project.yaml, agents/, .github/, .env*); they never replace them.
protected_paths:
  - constitution.md
  - spec.md
  - plan.md
  - tasks.md
  - project.yaml
  - "agents/*"
  - ".github/*"
  - ".env*"
