# Worked example: spanslo, the pilot project (Go scorer + Python benchmark).
# Copy this into the spanslo repo as `project.yaml`.
name: spanslo

commands:
  build: "go build ./..."
  test: "go vet ./... && go test ./... && (cd bench && uv run ruff check && uv run pytest)"
  run: "go run ./cmd/spanslo"
  smoke: "go run ./cmd/spanslo"

has_ui: false
base_url: ""

models:
  primary: claude
  fallback: gemini-3.8-flash
  fallback_provider: agy        # agy | gemini-api (gemini-api needs GEMINI_API_KEY in the environment)
  fallback_allowed_for:
    - tests
    - docs
    - small-fixes

limits:
  review_retry_cap: 3
  probe_interval_minutes: 20
  default_cooldown_minutes: 300
  agent_timeout_minutes: 30

agents:
  developer:
    mode: agent                 # agent (edits in a git worktree) | diff (unified diff from snapshot)
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep

context:
  max_chars: 120000
  include:
    - "core/*"
    - "cmd/*"
    - "collector/*"
    - "spec/*.yaml"
    - "spec/*.json"
    - "spec/*.md"
    - "catalog/*"
    - "bench/pyproject.toml"
    - "bench/tests/*"
    - "go.mod"
  exclude:
    - "*.lock"
    - "uv.lock"
    - "go.sum"
    - "spec/examples/*"
    - "docs/plan-private.md"
    - "LICENSE*"
  docs:
    constitution:
      - CLAUDE.md
      - constitution.md
    spec:
      - spec.md
      - docs/design.md
      - spec/sli-definitions.md
    plan:
      - plan.md
      - docs/design.md

# Regexes (case insensitive) matched against error output only. A match means rate limited.
rate_limit_patterns:
  claude:
    - "hit your limit"
    - "usage limit"
    - "rate limit"
    - "limit reached"
  agy:
    - "RESOURCE_EXHAUSTED"
    - "quota"
    - "rate limit"
    - "\\b429\\b"

# Frozen at gate G1 + dependency and hook guardrails from CLAUDE.md.
protected_paths:
  - constitution.md
  - CLAUDE.md
  - spec.md
  - plan.md
  - tasks.md
  - project.yaml
  - "spec/*"
  - "catalog/*"
  - "docs/design.md"
  - "docs/plan-private.md"
  - "docs/adr/*"
  - "docs/g0/*"
  - "go.mod"
  - "go.sum"
  - "bench/pyproject.toml"
  - "bench/uv.lock"
  - ".githooks/*"
  - "agents/*"
  - ".github/*"
  - ".env*"
