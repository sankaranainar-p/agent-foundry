[project]
name = "agent-foundry"
version = "0.1.0"
description = "Spec-driven software factory for AI agents"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
